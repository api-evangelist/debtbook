# DebtBook integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in debtbook-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: debtbook-govramp
  label: GovRAMP
  partner_name: GovRAMP
  category: GovRAMP participation
  type: register
  channel: standard-directory
  evidence: https://govramp.org/program-participants
  source: edge
  relationship: standard-participant
  contract_reference:
    register: GovRAMP Program Participants (govramp.org/program-participants)
    standard: GovRAMP
    spec_file: null
    role: govramp-participant
    registered_name: Fifth Asset d/b/a DebtBook
    register_id: SR26020
    matched_domain: debtbook.com
    matched_by: domain
    domain_source: contact-email
    statuses:
    - In Process
    offerings:
    - DebtBook
    signal_note: certified_products = one entry per AUTHORIZED impact level (Authorized / Provisionally Authorized),
      never per offering; Progressing / Pending / Ready / Core are participation only
    detected_by: sweep-gov-cloud.py
    detected: '2026-10-15'
  status: not-a-workflow
  arazzo: null
- slug: debtbook-cloud-security-alliance-star-registry
  label: Cloud Security Alliance STAR Registry
  partner_name: Cloud Security Alliance STAR Registry
  category: Cloud security assurance
  type: register
  channel: standard-directory
  evidence: https://cloudsecurityalliance.org/star/registry/debtbook/services/debtbook
  source: edge
  relationship: standard-participant
  contract_reference:
    register: CSA STAR Registry (cloudsecurityalliance.org/star/registry)
    spec_file: null
    standard: CSA STAR
    role: star-level-1
    registered_name: DebtBook
    registry_id: debtbook
    service_url: https://www.debtbook.com
    matched_domain: debtbook.com
    matched_by: domain
    identity_source: the service URL the organisation filed on its STAR listing (no lookup)
    levels:
    - STAR Level 1
    certified_products: []
    signal_note: STAR Level 1 (CAIQ self-assessment) = participation; certified_products = one entry per STAR Level
      2 / STAR for AI Level 2 assessment TYPE (third-party certification, attestation, C-STAR, ValidAIted); lapsed
      = every instance marked (Deprecated) by the registry; service counts never recorded
    detected_by: sweep-compliance-assurance.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
