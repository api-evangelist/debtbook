aid: debtbook
name: DebtBook
description: 'DebtBook (a trademark of Fifth Asset, Inc., Charlotte, NC) is a cloud-based
  treasury and accounting software platform built for public finance teams — state
  and local government, K-12 and higher education, healthcare, and nonprofits. The
  platform covers debt management, cash management, investment management, contract
  management, and lease/subscription accounting under GASB 87, GASB 96 and ASC 842,
  plus an AI layer (Insights and the Marty analyst) that produces daily briefings and
  plain-English answers over an organization''s treasury data. DebtBook''s Cash Management
  product pulls real-time bank account data into the platform through a secure API
  integration powered by Koxa''s Treasury Gateway, connecting customers to accounts
  at PNC, Regions Bank, Bank of America, JPMorgan, Wells Fargo and a growing list of
  US banks. As of this profile DebtBook publishes no public developer portal, no API
  reference, and no machine-readable API contract — its API surface is an inbound,
  contracted integration governed by published API integration terms rather than a
  self-service developer program.'
