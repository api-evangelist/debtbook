notes: 'app.debtbook.com and app.use1.prod.debtbook.com are single-page applications
  whose server answers HTTP 200 with the SPA HTML shell for EVERY /.well-known/* path.
  Those 200s are catch-all false positives, not published documents — every response
  body was `<!doctype html>`, not JSON/text — and are recorded here as `status: 200`
  with `spa_catch_all: true` so a later run does not mistake them for real discovery
  documents. The only genuine /.well-known/ documents DebtBook serves are the OIDC
  and OAuth 2.0 Authorization Server metadata on its Okta tenant.'
